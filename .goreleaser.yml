  # - image_templates:
  #     - fopina/{{ .ProjectName }}:{{ .Version }}-armv7
  #   dockerfile: Dockerfile.release
  #   use: buildx
  #   goos: linux
  #   goarch: arm
  #   goarm: '7'
  #   ids: *docker-ids
  #   build_flag_templates:
  #     - --platform=linux/arm/v7

  - image_templates:
      - fopina/{{ .ProjectName }}:{{ .Version }}-light-amd64
    dockerfile: Dockerfile.release
    use: buildx
    goos: linux
    goarch: amd64
    ids: &docker-ids
      - dkron
    build_flag_templates:
      - --platform=linux/amd64

  - image_templates:
      - fopina/{{ .ProjectName }}:{{ .Version }}-light-arm64
    dockerfile: Dockerfile.release
    use: buildx
    goos: linux
    goarch: arm64
    ids: *docker-ids
    build_flag_templates:
      - --platform=linux/arm64/v8

  - image_templates:
      - fopina/{{ .ProjectName }}:{{ .Version }}-light-armv7
    dockerfile: Dockerfile.release
    use: buildx
    goos: linux
    goarch: arm
    goarm: '7'
    ids: *docker-ids
    build_flag_templates:
      - --platform=linux/arm/v7

docker_manifests:
