version: 2

project_name: dkron

env:
  # FIXME: PR to dkron to make it "sexy and forkable"
  - FOOBAR={{ if index .Env "FOOBAR"  }}{{ .Env.FOOBAR }}{{ else }}xtest{{ end }}

release:
  prerelease: auto

builds:
  - &xbuild
    main: .
    id: dkron
    binary: dkron
    env:
      - CGO_ENABLED=0
    goos:
      # - freebsd
      # - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - '7'
    ldflags:
      - -s -w -X github.com/distribworks/dkron/v4/dkron.Version={{.Version}} -X github.com/distribworks/dkron/v4/dkron.Codename=Abaniko

snapshot:
  version_template: "{{ .Tag }}-{{ .Env.FOOBAR }}-next"

dockers:
  # - image_templates:
  #     - fopina/{{ .ProjectName }}:{{ .Version }}-amd64
  #   dockerfile: Dockerfile.release
  #   use: buildx
  #   goos: linux
  #   goarch: amd64
  #   ids: &docker-ids
  #     - dkron
  #     - dkron-executor-rabbitmq
