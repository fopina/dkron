  - name_template: fopina/{{ .ProjectName }}:{{ .Version }}-light
    image_templates:
    - fopina/{{ .ProjectName }}:{{ .Version }}-light-amd64
    - fopina/{{ .ProjectName }}:{{ .Version }}-light-arm64
    - fopina/{{ .ProjectName }}:{{ .Version }}-light-armv7

  - name_template: fopina/{{ .ProjectName }}:light
    image_templates:
    - fopina/{{ .ProjectName }}:{{ .Version }}-light-amd64
    - fopina/{{ .ProjectName }}:{{ .Version }}-light-arm64
    - fopina/{{ .ProjectName }}:{{ .Version }}-light-armv7

changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - '^Merge pull request'