  #     - dkron-processor-fluent
  #   build_flag_templates:
  #     - --platform=linux/amd64

  # - image_templates:
  #     - fopina/{{ .ProjectName }}:{{ .Version }}-arm64
  #   dockerfile: Dockerfile.release
  #   use: buildx
  #   goos: linux
  #   goarch: arm64
  #   ids: *docker-ids
  #   build_flag_templates:
